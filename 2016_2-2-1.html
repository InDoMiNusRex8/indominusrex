<button id="checkButton" style="margin-top: 10px; font-family: Computer Modern Serif, sans-serif;">Check Answers</button>
<button id="resetTimerButton" style="margin-top: 10px; font-family: Computer Modern Serif, sans-serif;">Restart Timer</button>
<div id="resultMessage" style="margin-top: 10px; font-family: Computer Modern Serif, sans-serif;"></div>


<div id="timerDisplay" style="font-family: Computer Modern Serif, sans-serif;">Time remaining: <span id="timer">12:00</span></div>


<script>
  document.addEventListener('DOMContentLoaded', function () {
      let timer;
      const defaultTime = 720; // 10 minutes in seconds
      let timerSeconds = parseInt(localStorage.getItem('timerSeconds')) || defaultTime;

      function updateTimerDisplay() {
          const minutes = Math.floor(timerSeconds / 60);
          const seconds = timerSeconds % 60;
          document.getElementById('timer').textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      }

      function startTimer() {
          if (timer) clearInterval(timer);

          timer = setInterval(function () {
              if (timerSeconds > 0) {
                  timerSeconds--;
                  localStorage.setItem('timerSeconds', timerSeconds);
                  updateTimerDisplay();
              } else {
                  clearInterval(timer);
                  document.getElementById('checkButton').style.display = 'none';
                  checkAllAnswers(); // Auto-check when time is up
              }
          }, 1000);
      }

      function resetTimer() {
          clearInterval(timer);
          timerSeconds = defaultTime;
          localStorage.setItem('timerSeconds', timerSeconds);
          updateTimerDisplay();
          startTimer();
          clearInputs();
      }

      function clearInputs() {
          document.querySelectorAll('input[data-answer]').forEach(input => {
              input.value = '';
              input.style.backgroundColor = 'transparent';
          });
          document.getElementById('resultMessage').textContent = '';
          document.getElementById('checkButton').style.display = 'inline-block';
      }

      function isInAssistiveMathML(element) {
          while (element) {
              if (element.tagName && element.tagName.toLowerCase() === "annotation-xml") {
                  return true;
              }
              element = element.parentNode;
          }
          return false;
      }

      function checkAnswer(element) {
          let userInput = element.value.trim();
          let correctAnswer = element.dataset.answer.trim();

          if (userInput === correctAnswer) {
              element.style.backgroundColor = 'rgba(0, 255, 0, 0.3)'; // Light green
              return true;
          } else {
              element.style.backgroundColor = 'rgba(255, 0, 0, 0.3)'; // Light red
              return false;
          }
      }

      function checkAllAnswers() {
          const inputFields = [...document.querySelectorAll('input[data-answer]')].filter(el => !isInAssistiveMathML(el));

          let allCorrect = true;
          let totalScore = 0;

          inputFields.forEach(element => {
              if (checkAnswer(element)) {
                  totalScore += parseInt(element.dataset.score || "1");
              } else {
                  allCorrect = false;
              }
          });

          const resultMessage = document.getElementById('resultMessage');
          if (allCorrect) {
              resultMessage.textContent = `All answers are correct! Score: ${totalScore}`;
          } else {
              resultMessage.textContent = `Score: ${totalScore}. Some answers are incorrect. Try again.`;
          }

          clearInterval(timer); 
          document.getElementById('checkButton').style.display = 'none';
      }

      document.getElementById('checkButton').addEventListener('click', checkAllAnswers);
      document.getElementById('resetTimerButton').addEventListener('click', resetTimer);

      document.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') {
              event.preventDefault();
              document.getElementById('checkButton').click();
          }
      });

      updateTimerDisplay();
      startTimer();
  });

</script>
