<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>
    <script type="text/javascript" async src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script type="text/javascript" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-svg.js"></script>
    <script>
      window.MathJax = {
        options: {
          enableAssistiveMml: false // Disable assistive MathML
        },
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
      };
    </script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/aaaakshat/cm-web-fonts@latest/fonts.css">
    <style>
    .input {
      width: 20px;
      text-align: center;
      font-family: Computer Modern Serif, sans-serif;
    }

    .red {
      background-color: darkred;
    }
    </style>
</head>
<body>

<math display="block" class="tml-display" style="display:block math;">
  <mrow>
    <msubsup>
      <mo movablelimits="false">∫</mo>
      <mn>2</mn>
      <mn>3</mn>
    </msubsup>
    <msup>
      <mi>x</mi>
      <mn>2</mn>
    </msup>
    <mo>=</mo>
    <mfrac>
      <mrow>

      <mn><semantics>
        <annotation-xml encoding="application/xhtml+xml">
          <input xmlns="http://www.w3.org/1999/xhtml" placeholder="A" autocomplete="off" class="input" data-answer="1" data-score="2" type="text" oninput="this.value = this.value.replace(/[^0-9-]/g, '')  .replace(/(?!^)-/g, '')  .slice(0, 1); 
           if(this.value !== '') this.setAttribute('value', this.value);"> 
        </annotation-xml></semantics></mn>

        <mn><semantics>
        <annotation-xml encoding="application/xhtml+xml">
          <input xmlns="http://www.w3.org/1999/xhtml" placeholder="B" autocomplete="off" class="input" data-answer="9" data-score="3" type="text" oninput="this.value = this.value.replace(/[^0-9-]/g, '')  .replace(/(?!^)-/g, '')  .slice(0, 1); 
           if(this.value !== '') this.setAttribute('value', this.value);"> 
        </annotation-xml></semantics></mn>

      </mrow>

      <mn><semantics>
        <annotation-xml encoding="application/xhtml+xml">
          <input xmlns="http://www.w3.org/1999/xhtml" placeholder="C" autocomplete="off" class="input" data-answer="3" data-score="4" type="text" oninput="this.value = this.value.replace(/[^0-9-]/g, '')  .replace(/(?!^)-/g, '')  .slice(0, 1); if(this.value !== '') this.setAttribute('value', this.value);"> 
        </annotation-xml></semantics></mn>

    </mfrac>
  </mrow>
</math>

<br>
<button id="checkButton" style="margin-top: 10px; font-family: Computer Modern Serif, sans-serif;">Check Answers</button>
<div id="resultMessage" style="margin-top: 10px; font-family: Computer Modern Serif, sans-serif;"></div>


<div id="timerDisplay" style="font-family: Computer Modern Serif, sans-serif;">Time remaining: <span id="timer">00:10</span></div>


<script>
  let timer;
  let timerSeconds = 10; // Set the timer duration in seconds

  function startTimer() {
    timer = setInterval(function () {
      timerSeconds--;
      const minutes = Math.floor(timerSeconds / 60);
      const seconds = timerSeconds % 60;
      const formattedTime = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      document.getElementById('timer').textContent = formattedTime; // Update the displayed timer value
      if (timerSeconds <= 0) {
        clearInterval(timer);
        const allCorrect = checkAllAnswers(); // Check all answers when time's up
        document.getElementById('checkButton').style.display = 'none'; // Hide the check button after time's up
        const resultMessage = document.getElementById('resultMessage');
        if (allCorrect) {
          resultMessage.textContent = 'Time\'s up! All answers are correct!';
        } else {
          resultMessage.textContent = 'Time\'s up! Some answers are incorrect. Please try again.';
        }
      }
    }, 1000);
  }



  function startQuiz() {
    startTimer();
  }

  function isInAssistiveMathML(element) {
    while (element) {
        if (element.tagName && element.tagName.toLowerCase() === "annotation-xml") {
            return true;
        }
        element = element.parentNode;
    }
    return false;
}

  function checkAnswer(element) {
    let userInput = element.value.trim(); // Trim spaces
    let correctAnswer = element.dataset.answer;

    console.log(`Input Value: ${userInput}`);
    console.log(`Correct Answer: ${correctAnswer}`);

    if (userInput === "") {
        return false; // Empty input should not be considered correct
    }

    let isCorrect = userInput === correctAnswer;
    console.log(`Input: ${userInput}, Answer: ${correctAnswer}, Correct: ${isCorrect}, Score: ${element.dataset.score}`);

    return isCorrect;
}


  function checkAllAnswers() {
      const inputFields = [...document.querySelectorAll('input[data-answer]')].filter(el => {
          return el.closest('annotation-xml') === null;
      });
      
      let allCorrect = true;
      let totalScore = 0;
      let anyAnswerProvided = false;

      inputFields.forEach(function (element) {
          let isCorrect = checkAnswer(element);
          let score = parseInt(element.dataset.score || "1"); // Default to 1 if no score is set

          if (isCorrect) {
              anyAnswerProvided = true;
              totalScore += score;
          } else {
              allCorrect = false;
          }
      });

      const resultMessage = document.getElementById('resultMessage');
      if (allCorrect && anyAnswerProvided) {
          resultMessage.textContent = `All answers are correct! Your score is ${totalScore}.`;
      } else if (anyAnswerProvided) {
          resultMessage.textContent = `Your score is ${totalScore}. Some answers are incorrect. Please try again.`;
      } else {
          resultMessage.textContent = `Your score is 0. No answers were provided. Please try again.`;  
      }

      clearInterval(timer);
      document.getElementById('checkButton').style.display = 'none';

      return allCorrect;
  }







  document.addEventListener('DOMContentLoaded', function () {
    // Log all detected inputs to check if assistive MathML is included
    console.log([...document.querySelectorAll('input[data-answer]')]);

    

    // Attach event listener to check button
    const checkButton = document.getElementById('check-answers');
    if (checkButton) {
        checkButton.addEventListener('click', checkAllAnswers);
    }

    // Force MathJax to re-render
    if (window.MathJax) {
        window.MathJax.typesetPromise().then(() => {
            console.log("MathJax re-rendered.");
        });
    }
});
    
</script>

</body>
</html>
